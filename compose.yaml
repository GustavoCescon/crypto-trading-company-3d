name: crypto-trading-company-3d
x-worker: &worker
  image: crypto-trading-company-3d-api:latest
  build:
    context: .
    target: runtime
  command: [ctc-worker]
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    api:
      condition: service_healthy
x-worker-env: &worker-env
  DATABASE_URL: postgres://ctc:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ctc
  TRADING_MODE: simulated
  INITIAL_BALANCE: ${INITIAL_BALANCE:-1000}
  ORDER_BUDGET: ${ORDER_BUDGET:-300}
  MAX_ASSET_EXPOSURE: ${MAX_ASSET_EXPOSURE:-0.15}
  MAX_TOTAL_EXPOSURE: ${MAX_TOTAL_EXPOSURE:-0.3}
  DAILY_LOSS_LIMIT: ${DAILY_LOSS_LIMIT:-0.03}
  MAX_DRAWDOWN: ${MAX_DRAWDOWN:-0.1}
  STOP_LOSS: ${STOP_LOSS:-0.025}
  TAKE_PROFIT: ${TAKE_PROFIT:-0.04}
  MAX_POSITIONS: ${MAX_POSITIONS:-5}
  FEE_BPS: ${FEE_BPS:-10}
  SPREAD_BPS: ${SPREAD_BPS:-2}
  SLIPPAGE_BPS: ${SLIPPAGE_BPS:-3}
services:
  market:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ROLE: market
      SCANNER_TOP_N: ${SCANNER_TOP_N:-8}
      BINANCE_REST_URL: ${BINANCE_REST_URL:-https://data-api.binance.vision}
      BINANCE_WS_URL: ${BINANCE_WS_URL:-wss://data-stream.binance.vision}
  risk:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ROLE: risk
  execution:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ROLE: execution
  news:
    build: ./services/news
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ctc:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ctc
      NEWS_FEEDS: ${NEWS_FEEDS:-https://www.coindesk.com/arc/outboundfeeds/rss/}
      NEWS_ALLOWED_HOSTS: ${NEWS_ALLOWED_HOSTS:-www.coindesk.com,cointelegraph.com}
      NEWS_INTERVAL: ${NEWS_INTERVAL:-300}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
    depends_on:
      api:
        condition: service_healthy
  frontend:
    build: ./apps/office
    ports:
      - 127.0.0.1:5173:80
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: timescale/timescaledb:2.22.0-pg17
    environment:
      POSTGRES_USER: ctc
      POSTGRES_DB: ctc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ctc -d ctc']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgres://ctc:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ctc
      REDIS_URL: redis://redis:6379
      TRADING_MODE: ${TRADING_MODE:-simulated}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/health/ready]
      interval: 5s
      timeout: 5s
      retries: 20
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  tests:
    profiles: [test]
    build:
      context: .
      target: development
    environment:
      DATABASE_URL: postgres://ctc:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ctc
      REDIS_URL: redis://redis:6379
    depends_on:
      api:
        condition: service_healthy
    command: [cargo, test, --locked, --workspace, --, --include-ignored]
  smoke:
    profiles: [test]
    image: python:3.13.7-slim
    volumes:
      - ./tests:/tests:ro
    environment:
      API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    command: [python, -m, unittest, discover, -s, /tests, -v]
volumes:
  postgres-data:
  redis-data:
