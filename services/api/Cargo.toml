[package]
name = "ctc-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ctc-contracts = { path = "../../packages/contracts" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "uuid", "json"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["trace"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
